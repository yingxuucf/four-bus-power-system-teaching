[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "four-bus-power-system-teaching"
version = "1.0.0"
description = "A four-bus case that connects a complete undergraduate power-system analysis course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
four_bus_system = ["data/*.json"]
